[build-system]
requires = ["setuptools>=68", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amaya"
version = "0.0.0+wasm"  # wasm/build.sh appends a hash of the sources: 0.0.0+wasm.<hash>
description = "Amaya, an automata-based LIA SMT solver (WebAssembly/Pyodide build)"
requires-python = ">=3.12"
license = "MPL-2.0"
dependencies = []

[project.optional-dependencies]
# Exporting automata; not needed for solving. The web bundle ships them as separate wheels.
visualization = ["graphviz", "dd"]
