[build-system]
requires = ["setuptools>=68", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amaya"
version = "0.0.0+wasm"
description = "Amaya, an automata-based LIA SMT solver (WebAssembly/Pyodide build)"
requires-python = ">=3.12"
license = "MPL-2.0"
dependencies = []

[project.optional-dependencies]
# Visualisation of automata; not needed for solving.
visualization = ["graphviz"]
