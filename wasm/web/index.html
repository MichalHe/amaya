<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amaya in the browser</title>
<style>
  :root { --bg: #fafafa; --fg: #1c1c1c; --muted: #666; --panel: #fff; --border: #d4d4d4; --accent: #2457c5;
          --sat: #1e7d32; --unsat: #b3261e; --track-bg: #e3e3e3;
          --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #e6e6e6; --muted: #9a9a9a; --panel: #1f1f1f; --border: #3a3a3a; --accent: #7aa2ff;
            --sat: #7bd88f; --unsat: #ff8a80; --track-bg: #3d3d3d; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* also for elements whose class sets display, e.g. .row */
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  textarea, input, select, button { font: inherit; color: inherit; }
  textarea { width: 100%; min-height: 220px; padding: 10px; font-family: var(--mono); font-size: 13px;
             background: var(--panel); border: 1px solid var(--border); border-radius: 6px; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .row > div { flex: 1 1 200px; }
  input[type=text], input[type=number], select { width: 100%; padding: 7px 9px; background: var(--panel);
             border: 1px solid var(--border); border-radius: 6px; }
  button { padding: 8px 18px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  button.secondary { background: var(--panel); color: var(--fg); border: 1px solid var(--border); padding: 7px 14px; }
  button.secondary[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  label.inline { display: inline-flex; gap: 6px; align-items: center; margin: 0 6px; font-weight: 600; }
  #example-about { margin: 6px 0 0; color: var(--muted); font-size: 14px; min-height: 1.5em; }
  #status { margin-top: 16px; color: var(--muted); min-height: 1.5em; }
  #answer { font: 700 1.6rem var(--mono); margin: 8px 0; }
  #answer.sat { color: var(--sat); } #answer.unsat { color: var(--unsat); }
  pre { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px;
        font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  #automata { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 8px; }
  #automata h2 { font-size: 1.1rem; margin: 8px 0 0; }
  #automaton-info { margin: 10px 0; font-size: 14px; color: var(--muted); }
  #graph { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px;
           overflow: auto; max-height: 75vh; min-height: 80px; }
  #graph.fit svg { max-width: 100%; height: auto; }
  #graph svg { display: block; margin: 0 auto; }
  #graph p { margin: 0; color: var(--muted); }
  #graph p button { margin-left: 8px; }
  #source { max-height: 75vh; }
</style>
</head>
<body>
<main>
  <h1>Amaya in the browser</h1>
  <p class="lead">Amaya, an automata-based LIA SMT solver, running locally as WebAssembly (Pyodide).
    Set <em>Automata</em> to <em>graph</em> to see the automata it builds.</p>

  <label for="example">Example</label>
  <select id="example"></select>
  <p id="example-about"></p>

  <label for="formula">SMT-LIB2 input</label>
  <textarea id="formula" spellcheck="false"></textarea>

  <div class="row">
    <div><label for="args">Options</label><input id="args" type="text" value="--fast"></div>
    <div style="flex: 0 1 160px"><label for="timeout">Timeout (s)</label><input id="timeout" type="number" min="1" value="60"></div>
    <div style="flex: 0 1 170px"><label for="export">Automata</label>
      <select id="export">
        <option value="">don't export</option>
        <option value="dot">graph (DOT)</option>
        <option value="vtf">VTF</option>
        <option value="mata">Mata</option>
      </select></div>
    <div style="flex: 0 1 auto"><label><input id="model" type="checkbox"> print model</label></div>
    <div style="flex: 0 1 auto"><button id="run" disabled>Solve</button></div>
  </div>

  <div id="status">Loading Amaya…</div>
  <div id="answer"></div>
  <pre id="output" hidden></pre>

  <section id="automata" hidden>
    <h2>Automata</h2>
    <div class="row">
      <div><label for="automaton">Automaton</label><select id="automaton"></select></div>
      <div style="flex: 0 1 auto" class="buttons">
        <button id="view-graph" class="secondary" aria-pressed="true">Graph</button>
        <button id="view-source" class="secondary" aria-pressed="false">Source</button>
        <button id="zoom" class="secondary">Actual size</button>
        <button id="download" class="secondary">Download</button>
        <label class="inline"><input id="names" type="checkbox" checked> variable names</label>
      </div>
    </div>
    <div id="automaton-info"></div>
    <div id="graph" class="fit"></div>
    <pre id="source" hidden></pre>
  </section>

  <footer id="footer"></footer>
</main>

<script type="module" src="./playground.js"></script>
</body>
</html>
